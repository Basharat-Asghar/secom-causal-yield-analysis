[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secom-causal"
version = "0.1.0"
description = "Causal Root-Cause Analysis of Yield Loss on the UCI SECOM Dataset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2.2",
    "pandas>=2.1,<2.3",
    "scipy>=1.11,<1.16",
    "scikit-learn>=1.4,<1.7",
    "pyyaml>=6.0,<7.0",
    "matplotlib>=3.8,<3.11",
    "lightgbm>=4.3,<4.7",
    "shap>=0.45,<0.48",
    "causal-learn>=0.1.3.8",
    "lingam>=1.8.3",
    "dowhy>=0.11.1",
    "networkx>=3.2,<3.5",
    "plotly>=5.20,<6.1",
    "streamlit>=1.35,<1.45",
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
