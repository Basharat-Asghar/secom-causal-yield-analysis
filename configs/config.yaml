seed: 42

data:
  uci_zip_url: "https://archive.ics.uci.edu/static/public/179/secom.zip"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  secom_data_file: "secom.data"
  secom_labels_file: "secom_labels.data"
  secom_names_file: "secom.names"

preprocessing:
  train_fraction: 0.70
  drop_constant: true
  high_missing_flag_threshold: 0.30
  high_missing_drop_threshold: 0.55
  add_missing_indicators: true
  indicator_min_missing_rate: 0.01
  primary_imputation: "median_indicator"
  iterative_imputation:
    max_iter: 10
    n_nearest_features: 20
    tol: 0.001

drift:
  n_time_bins: 5
  psi_warn_threshold: 0.25
  ks_alpha: 0.01

reports:
  dir: "reports"
  figures_dir: "reports/figures"

phase2:
  cv_splits: 5
  bootstrap_resamples: 1000
  confidence_level: 0.95
  precision_targets:
    - 0.15
    - 0.20
    - 0.30

phase3:
  primary_imputation: "iterative"
  n_bootstrap: 50
  subsample_fraction: 0.75
  l1_c: 0.25
  tree_top_k: 40
  mi_n_neighbors: 5
  configs:
    strict_45:
      target_k: 45
      corr_threshold: 0.85
      w_stability_l1: 0.40
      w_stability_tree: 0.35
      w_mi: 0.25
    broad_75:
      target_k: 75
      corr_threshold: 0.92
      w_stability_l1: 0.40
      w_stability_tree: 0.35
      w_mi: 0.25
    mi_heavy_55:
      target_k: 55
      corr_threshold: 0.88
      w_stability_l1: 0.20
      w_stability_tree: 0.25
      w_mi: 0.55
  default_screened_config: "strict_45"
